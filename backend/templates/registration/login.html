{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:380px">
<h1>Log in</h1>
{% if form.errors %}<p class="msg error">Wrong username or password.</p>{% endif %}
<form method="post">{% csrf_token %}
<p><label>Username<br><input name="username" autofocus></label></p>
<p><label>Password<br><input type="password" name="password"></label></p>
<button class="primary">Log in</button></form>
</div>
{% endblock %}
