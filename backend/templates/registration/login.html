{% extends "base.html" %}{% load ui %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:48px auto 0">
{% page_header title="Sign in" %}Fleet operations for home robots.{% endpage_header %}
{% if form.errors %}<p class="msg error" role="alert">Wrong username or password.</p>{% endif %}
<form method="post">{% csrf_token %}
<div class="field"><label for="id_username">Username</label><input id="id_username" name="username" autofocus autocomplete="username"></div>
<div class="field"><label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password"></div>
<button class="primary" style="width:100%">Sign in</button></form>
</div>
{% endblock %}
