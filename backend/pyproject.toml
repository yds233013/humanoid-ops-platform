[project]
name = "humanoid-ops-platform"
version = "0.1.0"
description = "Internal operations platform for a home humanoid robot pilot (Slice 0: foundation)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1,<5.2",
    "djangorestframework-stubs>=3.15,<3.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
markers = [
    "perf: Slice 5 p95 time budget on the scale fixture (run with -m perf; skipped otherwise)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"tests/*" = ["E501"]  # long raw-SQL strings in database tests
"fleet/models.py" = ["DJ001"]  # NULL deliberately means UNKNOWN on capability fields

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
disallow_untyped_defs = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*", "tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
