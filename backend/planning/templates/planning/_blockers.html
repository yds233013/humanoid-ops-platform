{% if plain %}<ul class="plainlist">{% for b in plain %}<li class="pb {{ b.level }}"><b>{{ b.sentence }}</b>{% if b.action %}<div class="muted">What to do: {{ b.action }}</div>{% endif %}</li>{% endfor %}</ul>
<details class="fold"><summary>Details</summary><div class="tablewrap"><table><thead><tr><th>Code</th><th>Level</th><th>Recorded message</th></tr></thead><tbody>{% for b in plain %}<tr><td>{{ b.code }}</td><td>{{ b.level }}</td><td>{{ b.raw }}</td></tr>{% endfor %}</tbody></table></div></details>{% endif %}
